# LiteLLM config — free-tier models only, grouped into three tiers.
#
# Clients call one of three model names; LiteLLM load-balances across every deployment that
# shares the name, so each provider's free rate limit is spread out:
#   lite     fast, small models — classification, extraction, short answers
#   base     general-purpose chat and writing (default choice)
#   complex  large / reasoning / coding models — hard problems, long documents
#
# Keys come from Secrets Manager (litellm/PROVIDER_API_KEY), set with ./set-secret.sh.
# Free tiers are rate-limited and may use prompts to improve provider models — don't send
# confidential data. Free model lists change often; re-check before relying on one:
#   Gemini     https://ai.google.dev/gemini-api/docs/pricing      (Free Tier column)
#   Groq       https://console.groq.com/docs/rate-limits          (free plan)
#   OpenRouter https://openrouter.ai/models?max_price=0           (":free" IDs)
#   Z.AI (GLM) https://docs.z.ai/guides/overview/pricing           (Flash models)
#   Cohere     https://docs.cohere.com/docs/rate-limits            (trial: 1,000 calls/month)
# Paid models (Bedrock, Anthropic, OpenAI, Azure) were removed for now — see git history.

model_list:
  # ================================ lite ==================================
  - model_name: lite
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY

  - model_name: lite
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
      rpm: 30

  - model_name: lite
    litellm_params:
      model: zai/glm-4.5-flash                         # Zhipu (China)
      api_key: os.environ/ZAI_API_KEY

  - model_name: lite
    litellm_params:
      model: openrouter/nvidia/nemotron-3.5-lightning:free
      api_key: os.environ/OPENROUTER_API_KEY

  # ================================ base ==================================
  - model_name: base
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: base
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      rpm: 30

  - model_name: base
    litellm_params:
      model: groq/qwen/qwen3.8-27b                     # Alibaba Qwen (China)
      api_key: os.environ/GROQ_API_KEY
      rpm: 30

  - model_name: base
    litellm_params:
      model: zai/glm-4.7-flash                         # Zhipu (China)
      api_key: os.environ/ZAI_API_KEY

  - model_name: base
    litellm_params:
      model: openrouter/minimax/minimax-m3.1-flash:free  # MiniMax (China)
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: base
    litellm_params:
      model: openrouter/google/gemma-4-31b-it:free
      api_key: os.environ/OPENROUTER_API_KEY

  # =============================== complex ================================
  - model_name: complex
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY

  - model_name: complex
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: complex
    litellm_params:
      model: openrouter/thinkingmachines/inkling:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: complex
    litellm_params:
      model: openrouter/poolside/laguna-s-2.1:free     # strong at coding
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: complex
    litellm_params:
      model: cohere/command-a-03-2025                  # trial key: 1,000 calls/month
      api_key: os.environ/COHERE_API_KEY
      rpm: 20

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 120
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  # Free deployments hit rate limits often: cool a failing one down, then fall back across tiers
  allowed_fails: 2
  cooldown_time: 60
  fallbacks:
    - lite: ["base"]
    - base: ["lite", "complex"]
    - complex: ["base"]

litellm_settings:
  drop_params: true
  request_timeout: 120

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  proxy_batch_write_at: 60
