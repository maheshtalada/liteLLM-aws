      aws_region_name: os.environ/AWS_REGION_NAME

  # bedrock-complex
  - model_name: bedrock-complex
    litellm_params:
      model: bedrock/global.anthropic.claude-opus-4-5-20251101-v1:0
      aws_region_name: os.environ/AWS_REGION_NAME

  - model_name: bedrock-complex
    litellm_params:
      model: bedrock/qwen.qwen3-coder-480b-a35b-v1:0
      aws_region_name: os.environ/AWS_REGION_NAME

  - model_name: bedrock-complex
    litellm_params:
      model: bedrock/in.moonshotai.kimi-k3                # reasoning model
      aws_region_name: os.environ/AWS_REGION_NAME

  # Exact Claude models by name
  - model_name: claude-haiku-4-5
    litellm_params:
      model: bedrock/in.anthropic.claude-haiku-4-5-20251001-v1:0
      aws_region_name: os.environ/AWS_REGION_NAME

  - model_name: claude-sonnet-4-6
    litellm_params:
      model: bedrock/global.anthropic.claude-sonnet-4-6
      aws_region_name: os.environ/AWS_REGION_NAME

  - model_name: claude-opus-4-5
    litellm_params:
      model: bedrock/global.anthropic.claude-opus-4-5-20251101-v1:0
      aws_region_name: os.environ/AWS_REGION_NAME

  # ============ Paid fallback for the free tiers (used only when free quota runs out) ============
  # Same idea as lite/base/complex, but billed. order 1 = Bedrock first (uses AWS credits); order 2 = OpenRouter
  # backup (needs OpenRouter credit). When AWS credits run out, swap the order values.
  - model_name: lite-paid
    litellm_params:
      model: bedrock/apac.amazon.nova-lite-v1:0
      aws_region_name: os.environ/AWS_REGION_NAME
      order: 1                         # 1 = tried first (Bedrock, paid from AWS credits)

  - model_name: lite-paid
    litellm_params:
      model: openrouter/qwen/qwen3.7-flash          # ~$0.03 / $0.13 per M tokens
      api_key: os.environ/OPENROUTER_API_KEY
      order: 2                         # backup; needs OpenRouter credit

  - model_name: base-paid
    litellm_params:
      model: bedrock/apac.amazon.nova-pro-v1:0
      aws_region_name: os.environ/AWS_REGION_NAME
      order: 1                         # 1 = tried first (Bedrock, paid from AWS credits)

  - model_name: base-paid
    litellm_params:
      model: bedrock/deepseek.v3.2
      aws_region_name: os.environ/AWS_REGION_NAME
      order: 1                         # 1 = tried first (Bedrock, paid from AWS credits)

  - model_name: base-paid
    litellm_params:
      model: openrouter/deepseek/deepseek-v4.1-flash
      api_key: os.environ/OPENROUTER_API_KEY
      order: 2                         # backup; needs OpenRouter credit

  - model_name: complex-paid
    litellm_params:
      model: bedrock/deepseek.v3.2
      aws_region_name: os.environ/AWS_REGION_NAME
      order: 1                         # 1 = tried first (Bedrock, paid from AWS credits)

  - model_name: complex-paid
    litellm_params:
      model: bedrock/apac.amazon.nova-pro-v1:0
      aws_region_name: os.environ/AWS_REGION_NAME
      order: 1                         # 1 = tried first (Bedrock, paid from AWS credits)

  - model_name: complex-paid
    litellm_params:
      model: openrouter/qwen/qwen3.7-plus
      api_key: os.environ/OPENROUTER_API_KEY
      order: 2                         # backup; needs OpenRouter credit

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 120
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  # Free deployments hit rate limits often: cool a failing one down, then fall back across tiers
  allowed_fails: 2
  cooldown_time: 60
  # Free tiers first; when every free model is out of quota, the matching *-paid group answers,
  # so students don't wait for the next day. Paid spend counts against each student key's budget.
  fallbacks:
    - lite: ["base", "lite-paid"]
    - base: ["lite", "complex", "base-paid"]
    - complex: ["base", "complex-paid"]
    - lite-paid: ["base-paid"]
    - base-paid: ["lite-paid"]
    - complex-paid: ["base-paid"]
    # Paid tiers only fall back to other paid tiers (never the other way round)
    - bedrock-lite: ["bedrock-base"]
    - bedrock-base: ["bedrock-lite"]
    - bedrock-complex: ["bedrock-base"]

litellm_settings:
  drop_params: true
  request_timeout: 120
  # Response cache in Redis: an identical request (same model name, messages and parameters) within
  # the TTL is answered from the cache, without calling the provider. That saves free-tier quota and
  # Bedrock money when a class runs the same exercise. Clients can skip the cache per request with
  #   extra_body={"cache": {"no-cache": True}}
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    ttl: 3600            # seconds (1 hour)

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  proxy_batch_write_at: 60
