# LiteLLM config — free-tier models in three tiers, plus paid Amazon Bedrock models under separate names.
#
# Clients call one of three model names; LiteLLM load-balances across every deployment that
# shares the name, so each provider's free rate limit is spread out:
#   lite     fast, small models — classification, extraction, short answers
#   base     general-purpose chat and writing (default choice)
#   complex  large / reasoning / coding models — hard problems, long documents
#
# Keys come from Secrets Manager (litellm/PROVIDER_API_KEY), set with ./set-secret.sh.
# Free tiers are rate-limited and may use prompts to improve provider models — don't send
# confidential data. Free model lists change often; re-check before relying on one:
#   Gemini     https://ai.google.dev/gemini-api/docs/pricing      (Free Tier column)
#   Groq       https://console.groq.com/docs/rate-limits          (free plan)
#   OpenRouter https://openrouter.ai/models?max_price=0           (":free" IDs)
#   Z.AI (GLM) https://docs.z.ai/guides/overview/pricing           (Flash models)
#   Cohere     https://docs.cohere.com/docs/rate-limits            (trial: 1,000 calls/month)
#
# Free deployments are priced at $0 (input/output_cost_per_token: 0), so a key's budget only counts paid usage.
# When the free tiers run out, they fall back to lite-paid / base-paid / complex-paid (Bedrock + OpenRouter
# credits). That spend is real and capped by each key's budget (e.g. new-key.sh --budget 1 --budget-duration 30d).
#
# bedrock-* / claude-* names below are PAID and used only when a client asks for them by name.
# Bedrock needs no API key: the EC2 instance role authenticates.
#   bedrock-lite     cheap        Nova Lite, Claude Haiku 4.5
#   bedrock-base     medium       Claude Sonnet 4.6, Nova Pro, DeepSeek V3.2
#   bedrock-complex  highest      Claude Opus 4.5, Qwen3 Coder 480B, Kimi K3
#   claude-haiku-4-5 / claude-sonnet-4-6 / claude-opus-4-5   that exact Claude model
# Model IDs callable from ap-south-1 (in.* = stays in India, apac.* = Asia-Pacific, global.* = any Region):
#   aws bedrock list-inference-profiles --region ap-south-1 --query 'inferenceProfileSummaries[].inferenceProfileId'
# Not yet enabled for this account (AccessDenied): Claude Sonnet/Opus 5.x, Haiku 5.5, Opus 4.8, GPT-5.x, GLM-5.3.

model_list:
  # ===== Free tiers — Gemini only for now (tested 2026-10-23 with the stored key) =====
  # Not used: gemini-3.8-flash / 3.7-flash (hang >60 s), gemini-2.5-pro / 2.5-flash ("no longer available to new
  # users"), gemini-pro-latest (not free). When free Gemini is exhausted, requests fall back to *-paid below.
  - model_name: lite
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      input_cost_per_token: 0          # free tier: never counts against budgets
      output_cost_per_token: 0

  - model_name: lite
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      input_cost_per_token: 0          # free tier: never counts against budgets
      output_cost_per_token: 0

  - model_name: base
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/GEMINI_API_KEY
      input_cost_per_token: 0          # free tier: never counts against budgets
      output_cost_per_token: 0

  - model_name: base
    litellm_params:
      model: gemini/gemini-3.5-flash   # often 503 'high demand'; LiteLLM skips it while busy
      api_key: os.environ/GEMINI_API_KEY
      input_cost_per_token: 0          # free tier: never counts against budgets
      output_cost_per_token: 0

  - model_name: complex
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/GEMINI_API_KEY
      input_cost_per_token: 0          # free tier: never counts against budgets
      output_cost_per_token: 0

  - model_name: complex
    litellm_params:
      model: gemini/gemini-3-flash-preview
      api_key: os.environ/GEMINI_API_KEY
      input_cost_per_token: 0          # free tier: never counts against budgets
      output_cost_per_token: 0

  # ===== Other free providers (Groq, OpenRouter, Z.AI enabled 2026-10-24; Cohere still needs a key) =====
  # To re-enable: uncomment the block(s), then ./reload.sh
  - model_name: lite
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
      input_cost_per_token: 0          # free tier: never counts against budgets
      output_cost_per_token: 0
      rpm: 30

  - model_name: lite
    litellm_params:
      model: zai/glm-4.5-flash                         # Zhipu (China)
      api_key: os.environ/ZAI_API_KEY
      input_cost_per_token: 0          # free tier: never counts against budgets
      output_cost_per_token: 0

  - model_name: lite
    litellm_params:
      model: openrouter/nvidia/nemotron-3.5-lightning:free
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0          # free tier: never counts against budgets
      output_cost_per_token: 0

  # # ================================ base ==================================

  - model_name: base
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      input_cost_per_token: 0          # free tier: never counts against budgets
      output_cost_per_token: 0
      rpm: 30

  - model_name: base
    litellm_params:
      model: groq/qwen/qwen3.8-27b                     # Alibaba Qwen (China)
      api_key: os.environ/GROQ_API_KEY
      input_cost_per_token: 0          # free tier: never counts against budgets
      output_cost_per_token: 0
      rpm: 30

  - model_name: base
    litellm_params:
      model: zai/glm-4.7-flash                         # Zhipu (China)
      api_key: os.environ/ZAI_API_KEY
      input_cost_per_token: 0          # free tier: never counts against budgets
      output_cost_per_token: 0

  - model_name: base
    litellm_params:
      model: openrouter/google/gemma-4-26b-a4b-it:free
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0          # free tier: never counts against budgets
      output_cost_per_token: 0

  - model_name: base
    litellm_params:
      model: openrouter/google/gemma-4-31b-it:free
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0          # free tier: never counts against budgets
      output_cost_per_token: 0

  # # =============================== complex ================================

  - model_name: complex
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0          # free tier: never counts against budgets
      output_cost_per_token: 0

  - model_name: complex
    litellm_params:
      model: groq/openai/gpt-oss-120b   # strong reasoning + tool calling
      api_key: os.environ/GROQ_API_KEY
      input_cost_per_token: 0          # free tier: never counts against budgets
      output_cost_per_token: 0

  - model_name: complex
    litellm_params:
      model: zai/glm-4.7-flash
      api_key: os.environ/ZAI_API_KEY
      input_cost_per_token: 0          # free tier: never counts against budgets
      output_cost_per_token: 0

  # - model_name: complex
  #   litellm_params:
  #     model: cohere/command-a-03-2025                  # trial key: 1,000 calls/month
  #     api_key: os.environ/COHERE_API_KEY
  #     input_cost_per_token: 0          # free tier: never counts against budgets
  #     output_cost_per_token: 0
  #     rpm: 20

  # ===================== Embeddings (for RAG / semantic search) =====================
  # One model per name and NO fallback: vectors from different models aren't compatible, so a project must keep
  # using the same name for indexing and searching.
  - model_name: embed
    litellm_params:
      model: gemini/gemini-embedding-001       # free, 3072 dimensions
      api_key: os.environ/GEMINI_API_KEY
      input_cost_per_token: 0
      output_cost_per_token: 0
    model_info:
      mode: embedding

  - model_name: embed-bedrock
    litellm_params:
      model: bedrock/amazon.titan-embed-text-v2:0   # paid (cheap), stays in Mumbai, 1024 dimensions
      aws_region_name: os.environ/AWS_REGION_NAME
    model_info:
      mode: embedding

  # ====================== Amazon Bedrock (PAID) ======================
  # bedrock-lite
  - model_name: bedrock-lite
    litellm_params:
      model: bedrock/apac.amazon.nova-lite-v1:0
      aws_region_name: os.environ/AWS_REGION_NAME

  - model_name: bedrock-lite
    litellm_params:
      model: bedrock/in.anthropic.claude-haiku-4-5-20251001-v1:0
      aws_region_name: os.environ/AWS_REGION_NAME

  # bedrock-base
  - model_name: bedrock-base
    litellm_params:
      model: bedrock/global.anthropic.claude-sonnet-4-6
      aws_region_name: os.environ/AWS_REGION_NAME

  - model_name: bedrock-base
